basePath: /api/v1
definitions:
  internal_handler.LoginReq:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_handler.ProductReq:
    properties:
      brand_id:
        type: string
      category_id:
        type: string
      condition:
        type: string
      description:
        type: string
      price:
        type: integer
      title:
        type: string
    required:
    - price
    - title
    type: object
  internal_handler.RefreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_handler.RegisterReq:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
info:
  contact: {}
  description: Thriftin second-hand marketplace API
  title: Thriftin API
  version: "1.0"
